plugins {
    id 'com.android.application'
}

android {
    namespace 'com.luizcalori.horadoalmocomanual'
    compileSdk 35

    defaultConfig {
        applicationId "com.luizcalori.horadoalmocomanual"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "1.0.5"
    }

    buildTypes {
        debug { debuggable false }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
