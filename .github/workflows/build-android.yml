name: Build e publicar Hora do Almoço Android

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar APK no canal estável"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SIGNING_PASSWORD: ${{ secrets.HORA_ALMOCO_SIGNING_PASSWORD }}
      KEY_ALIAS: hora-do-almoco

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -n 1)"

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Não foi possível ler versionName/versionCode."
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não corresponde ao versionName $VERSION_NAME."
            exit 1
          fi

          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Validate stable signing
        shell: bash
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "Secret ausente: HORA_ALMOCO_SIGNING_PASSWORD"
            exit 1
          fi

      - name: Restore stable keystore
        shell: bash
        run: |
          base64 --decode android/signing/hora-do-almoco-release.jks.b64 > "$RUNNER_TEMP/hora-do-almoco-release.jks"
          keytool -list             -keystore "$RUNNER_TEMP/hora-do-almoco-release.jks"             -storepass "$SIGNING_PASSWORD"             -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        working-directory: android
        shell: bash
        run: |
          gradle :app:assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/hora-do-almoco-release.jks" \
            -Pandroid.injected.signing.store.password="$SIGNING_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SIGNING_PASSWORD"

      - name: Prepare APK
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Hora-do-Almoco-Senior.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Hora-do-Almoco-Senior.apk
          sha256sum Hora-do-Almoco-Senior.apk > Hora-do-Almoco-Senior.apk.sha256

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hora-do-Almoco-Senior-v${{ steps.version.outputs.name }}
          path: |
            Hora-do-Almoco-Senior.apk
            Hora-do-Almoco-Senior.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish stable GitHub Release
        if: github.event_name == 'push' || inputs.publish_release == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          TAG="v$VERSION_NAME"
          NOTES="APK estável do Hora do Almoço $VERSION_NAME, com ícone oficial laranja e talheres."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Hora-do-Almoco-Senior.apk Hora-do-Almoco-Senior.apk.sha256 --clobber
            gh release edit "$TAG" --title "Hora do Almoço $VERSION_NAME" --notes "$NOTES"
          else
            gh release create "$TAG" Hora-do-Almoco-Senior.apk Hora-do-Almoco-Senior.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "Hora do Almoço $VERSION_NAME" \
              --notes "$NOTES"
          fi

      - name: Update app updater channel
        if: github.event_name == 'push' || inputs.publish_release == true
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          TAG="v$VERSION_NAME"
          APK_URL="https://github.com/Luizfcalori/Ponto-do-almo-o-/releases/download/$TAG/Hora-do-Almoco-Senior.apk"

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          jq -n \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg apkUrl "$APK_URL" \
            --arg notes "Novo ícone oficial do Hora do Almoço." \
            '{versionName:$versionName,versionCode:$versionCode,apkUrl:$apkUrl,notes:$notes}' \
            > app-update.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-update.json

          if git diff --cached --quiet; then
            echo "Canal de atualização já está em v$VERSION_NAME."
          else
            git commit -m "Publish Android update channel v$VERSION_NAME"
            git push origin main
          fi
